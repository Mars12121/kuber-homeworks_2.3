apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-https
data:
  default.conf: |
    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      /etc/nginx/ssl/tls.crt;
        ssl_certificate_key  /etc/nginx/ssl/tls.key;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Welcome!</title>
    </head>
    <body>
      <h1>Hi K8S!</h1>
    </body>
    </html>